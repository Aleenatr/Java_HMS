# Runs every test, including the ones that need MySQL, on each push and pull request.
name: Build and test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, run all tests and package the jar
        run: mvn -B verify
        env:
          HMS_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/hms_test
          HMS_TEST_DB_USER: root
          HMS_TEST_DB_PASSWORD: root
